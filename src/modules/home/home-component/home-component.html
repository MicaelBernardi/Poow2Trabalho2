<mat-toolbar class="px-4 d-flex align-items-center bg-light border-bottom text-dark" style="min-height: 64px;">

  <div class="d-flex align-items-center flex-grow-1">

    <div class="d-flex align-items-center me-4" style="cursor: pointer" routerLink="dashboard">
      <mat-icon class="me-2" style="color: #000;">settings</mat-icon>
      <span class="fs-5 fw-bold text-dark">Concessionária</span>
    </div>

    <nav class="d-none d-md-flex align-items-center gap-4">

      <a routerLink="dashboard"
         class="menu-link text-decoration-none text-secondary"
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{exact: true}">
        Página Inicial
      </a>

      <a routerLink="cliente"
         class="menu-link text-decoration-none text-secondary"
         routerLinkActive="active-link">
        Clientes
      </a>

      <a routerLink="servico"
         class="menu-link text-decoration-none text-secondary"
         routerLinkActive="active-link">
        Serviços
      </a>

      <a routerLink="funcionario"
         class="menu-link text-decoration-none text-secondary"
         routerLinkActive="active-link">
        Funcionários
      </a>

      <a routerLink="agendamento"
         class="menu-link text-decoration-none text-secondary"
         routerLinkActive="active-link">
        Agendamentos
      </a>
    </nav>
  </div>

  <div class="ms-auto d-flex align-items-center">
    <a mat-button color="warn" (click)="logout()" style="cursor: pointer;">
      <mat-icon class="me-1" style="font-size: 20px; height: 20px; width: 20px; vertical-align: middle;">exit_to_app</mat-icon>
      Sair
    </a>
  </div>

</mat-toolbar>

<div class="mt-4 px-4">
  <router-outlet></router-outlet>
</div>
