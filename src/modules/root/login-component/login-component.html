<form class="d-flex flex-column" [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline" class="w-100 mb-3">
    <mat-label>Email</mat-label>
    <input matInput type="email" autocomplete="email" formControlName="email" class="px-2">
    <mat-error>
      Email é obrigatório
    </mat-error>
  </mat-form-field>
  <mat-form-field appearance="outline" class="w-100 mb-2">
    <mat-label>Senha</mat-label>
    <input matInput autocomplete="current-password" type="password" formControlName="senha" class="px-2">
    <mat-error>
      Senha é obrigatória
    </mat-error>
  </mat-form-field>
  <button mat-raised-button type="submit" class="w-100 mb-2"> <span>Entrar</span> </button>

</form>
